<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <style>
    :root {
      --color-principal: #ff8c00;
      --color-secundario: #4b0082;
      --color-fondo: #f5f5f5;
      --color-error: #dc3545;
    }
    body {
      font-family: 'Arial', sans-serif;
      background-color: var(--color-fondo);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-image: linear-gradient(to top, var(--color-secundario) 0%, var(--color-principal) 100%);
    }
    .login-card {
      background-color: white;
      border-radius: 12px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
      padding: 40px;
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    .login-card h2 {
      color: var(--color-principal);
      margin-bottom: 30px;
    }
    .form-group {
      margin-bottom: 15px;
      text-align: left;
    }
    .form-control {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      margin-top: 5px;
    }
    .btn-login {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      background-color: var(--color-principal);
      color: white;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    .btn-login:hover {
      background-color: #cc7000;
    }
    .alert-danger {
      background-color: #f8d7da;
      color: var(--color-error);
      padding: 10px;
      border-radius: 4px;
      margin-bottom: 20px;
      border: 1px solid #f5c6cb;
    }
  </style>
</head>
<body>
<div class="login-card">
  <h2>Acceso al Festival</h2>

  <div th:if="${param.error}" class="alert-danger">
    Correo o contraseña inválidos.
  </div>
  <div th:if="${param.logout}" class="alert-success" style="background-color: #d4edda; color: var(--color-success);">
    Has cerrado sesión correctamente.
  </div>

  <form th:action="@{/login}" method="post">
    <div class="form-group">
      <label for="username">Correo Electrónico:</label>
      <input type="email" id="username" name="username" class="form-control" required/>
    </div>
    <div class="form-group">
      <label for="password">Contraseña:</label>
      <input type="password" id="password" name="password" class="form-control" required/>
    </div>
    <button type="submit" class="btn-login">Ingresar</button>
  </form>
</div>
</body>
</html>
